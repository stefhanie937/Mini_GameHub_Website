<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Game Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu">
    <h1>Mini Game Hub</h1>
    <div class="card-container">
      <div class="card" onclick="loadGame('memory_game/index.html')">
        <img src="images/memory.jpg" alt="Memory Game" />
      </div>
      <div class="card" onclick="loadGame('tic-tac-toe/index.html')">
        <img src="images/tic-tac-toe.jpg" alt="Tic Tac Toe" />
      </div>
      <div class="card" onclick="loadGame('snake_game/index.html')">
        <img src="images/snake.jpg" alt="Snake Game" />
      </div>
    </div>
  </div>

  <div id="game-container" style="display: none;">
    <button id="exit-btn" onclick="exitGame()">Back</button>
    <iframe id="game-frame" width="100%" height="600px" frameborder="0"></iframe>
  </div>

  <script>
    function loadGame(gameFile) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      document.getElementById('game-frame').src = gameFile;
    }

    function exitGame() {
      document.getElementById('game-frame').src = '';
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('menu').style.display = 'block';
    }
  </script>
  
  <footer>
    © 2025 All rights reserved.
  </footer>
</body>
</html>
